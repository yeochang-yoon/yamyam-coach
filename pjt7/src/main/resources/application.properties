spring.application.name=yamyam-pjt7
server.address=127.0.0.1
server.port=8077
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=YAMYAM7SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${YAMYAM_DB_URL:jdbc:mysql://127.0.0.1:3306/yamyam_pjt7?sslMode=REQUIRED}
spring.datasource.username=${YAMYAM_DB_USER:}
spring.datasource.password=${YAMYAM_DB_PASSWORD:}
mybatis.mapper-locations=classpath:mappers/*.xml

yamyam.cors.origins=${YAMYAM_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
springdoc.paths-to-match=/api/**
